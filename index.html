<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8384f">
  <meta name="description" content="数字をヒントに、フルーツの道をつなごう！小学生向けの論理パズルゲーム">
  <title>フルーツめいろ！</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="loading">
  <main id="app" class="app">

    <!-- タイトル -->
    <section id="screen-title" class="screen active" aria-label="タイトル">
      <button type="button" id="btn-settings-title" class="icon-btn title-settings" aria-label="設定" aria-haspopup="dialog">⚙️</button>
      <div class="title-wrap">
        <div class="title-deco" aria-hidden="true">
          <span>🍓</span><span>🍓</span><span>🍓</span>
        </div>
        <h1 class="title-logo"><span class="logo-fruit" aria-hidden="true">🍓</span>フルーツめいろ！</h1>
        <p class="catch">数字をヒントに、フルーツの道をつなごう！</p>
        <!-- 将来「3分チャレンジ」「フルーツ図鑑」「記録・称号」をここに追加する -->
        <nav id="title-menu" class="menu">
          <button type="button" class="btn primary big" data-action="play">▶ あそぶ</button>
          <button type="button" class="btn secondary big" data-action="howto">? あそびかた</button>
        </nav>
        <p id="load-error" class="load-error" hidden>
          問題データを よみこめませんでした。<br>
          <small>index.html を直接ひらいた場合は、Webサーバー経由でひらいてください（README を参照）。</small>
        </p>
      </div>
      <p class="copyright">©2026 T.TAKEMOTO / KEC Glows</p>
    </section>

    <!-- あそびかた -->
    <section id="screen-howto" class="screen" aria-label="あそびかた">
      <header class="bar">
        <button type="button" class="icon-btn" data-back="title" aria-label="タイトルへもどる">←</button>
        <h2 class="bar-title">あそびかた</h2>
        <span class="howto-step bar-right"></span>
      </header>
      <div class="howto-body">
        <h3 class="howto-title"></h3>
        <p class="howto-text"></p>
        <div class="howto-board"></div>
        <p class="howto-task" aria-live="polite"></p>
        <!-- 練習用の操作ボタン（ページごとに必要なものだけ表示） -->
        <div class="howto-tools">
          <button type="button" class="btn mode-cycle" data-tool="mode" data-mode="route">
            <span class="mode-icon" aria-hidden="true">🍓</span>
            <span class="mode-label">ルート</span>
            <span class="mode-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </button>
          <button type="button" class="btn hint-btn" data-tool="hint"><span aria-hidden="true">💡</span> ヒント</button>
          <button type="button" class="btn ghost" data-tool="reset"><span aria-hidden="true">↻</span> はじめから</button>
        </div>
        <div class="howto-hint"></div>
      </div>
      <footer class="howto-nav">
        <button type="button" class="btn secondary" data-howto="prev">◀ まえへ</button>
        <div class="howto-dots" aria-hidden="true"></div>
        <button type="button" class="btn primary" data-howto="next">つぎへ ▶</button>
      </footer>
    </section>

    <!-- 難易度選択 -->
    <section id="screen-select" class="screen" aria-label="むずかしさをえらぶ">
      <header class="bar">
        <button type="button" class="icon-btn" data-back="title" aria-label="タイトルへもどる">←</button>
        <h2 class="bar-title">むずかしさを えらぼう</h2>
        <span class="bar-right"></span>
      </header>
      <div id="level-list" class="level-list"></div>
    </section>

    <!-- ステージ選択 -->
    <section id="screen-stage" class="screen" aria-label="ステージをえらぶ">
      <header class="bar">
        <button type="button" class="icon-btn" data-back="select" aria-label="むずかしさ選択へもどる">←</button>
        <h2 class="bar-title">ステージを えらぼう</h2>
        <span class="bar-right"></span>
      </header>
      <div class="stage-head">
        <span id="stage-stars" class="stars"></span>
        <span id="stage-size" class="size"></span>
        <span id="stage-progress" class="stage-progress"></span>
      </div>
      <div class="stage-body">
        <div id="stage-grid" class="stage-grid" role="list"></div>
        <button type="button" id="btn-stage-random" class="btn primary stage-random">🎲 ランダム</button>
      </div>
    </section>

    <!-- ゲーム -->
    <section id="screen-game" class="screen" aria-label="パズル">
      <header class="game-top">
        <button type="button" class="icon-btn" data-back="stage" aria-label="ステージ選択へもどる">←</button>
        <div class="game-info">
          <span id="game-stars" class="stars"></span>
          <span id="game-size" class="size"></span>
        </div>
        <div class="game-timer" aria-label="タイム">⏱ <span id="game-timer">0:00</span></div>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="設定" aria-haspopup="dialog">⚙️</button>
      </header>
      <div id="board-area" class="board-area"></div>
      <!-- 短いお知らせ（数字をこえた・ゴールで数字が合わない など）。盤面の上に重ねて表示する -->
      <div id="game-msg" class="game-msg" aria-live="polite"></div>
      <div class="game-ctrl" id="game-ctrl">
        <div class="ctrl-row">
          <!-- 押すたびに ルート → ○つけ → ×つけ → 消す → ルート -->
          <button type="button" id="btn-mode" class="btn mode-cycle" data-mode="route" aria-label="操作モード：ルート（押すと切り替え）">
            <span class="mode-icon" aria-hidden="true">🍓</span>
            <span class="mode-label">ルート</span>
            <span class="mode-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </button>
          <button type="button" id="btn-hint" class="btn hint-btn"><span aria-hidden="true">💡</span> ヒント</button>
        </div>
        <!-- 5ボタン表示（設定で切り替え）：ルート／○／×／消す／💡 -->
        <div class="ctrl-row ctrl-five" id="ctrl-five" role="group" aria-label="操作モード" hidden>
          <button type="button" class="btn five-btn" data-mode="route" aria-pressed="true">ルート</button>
          <button type="button" class="btn five-btn" data-mode="memo-on" aria-pressed="false" aria-label="○を付ける">○</button>
          <button type="button" class="btn five-btn" data-mode="memo-off" aria-pressed="false" aria-label="×を付ける">×</button>
          <button type="button" class="btn five-btn" data-mode="memo-erase" aria-pressed="false" aria-label="○・×を消す">消す</button>
          <button type="button" id="btn-hint-five" class="btn hint-btn five-hint" aria-label="ヒント">💡</button>
        </div>
      </div>
      <div id="game-hint" class="game-hint"></div>

      <!-- クリア結果 -->
      <div id="result" class="result-overlay" hidden>
        <div class="result-card" role="dialog" aria-labelledby="result-title">
          <div id="result-fruit" class="result-fruit" aria-hidden="true">🍓</div>
          <h2 id="result-title" class="result-title">クリア！</h2>
          <div id="result-badge" class="result-badge"></div>
          <dl class="result-stats">
            <div><dt>むずかしさ</dt><dd><span id="result-stars" class="stars"></span> <small id="result-size"></small></dd></div>
            <div><dt>タイム</dt><dd id="result-time">0:00</dd></div>
          </dl>
          <div class="result-actions">
            <button type="button" id="btn-next" class="btn primary big">つぎの問題 ▶</button>
            <div class="result-sub">
              <button type="button" id="btn-retry" class="btn secondary">もういちど</button>
              <button type="button" id="btn-to-select" class="btn ghost">ステージ選択へ</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 設定（タイトル画面・プレイ画面の ⚙️ から開く） -->
    <div id="settings" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title" class="modal-title"><span aria-hidden="true">⚙️</span> せってい</h2>
        <div class="setting-row">
          <span class="setting-name">効果音</span>
          <div class="seg" data-setting="sound" role="group" aria-label="効果音">
            <button type="button" data-value="on">🔊 ON</button>
            <button type="button" data-value="off">🔈 OFF</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-name">マスの数</span>
          <div class="seg" data-setting="clueStyle" role="group" aria-label="行・列の数字の表示">
            <button type="button" data-value="target">3</button>
            <button type="button" data-value="fraction">1/3</button>
          </div>
        </div>
        <p class="setting-note" id="clue-note"></p>
        <div class="setting-row">
          <span class="setting-name">ボタン表示</span>
          <div class="seg" data-setting="buttons" role="group" aria-label="操作ボタンの表示">
            <button type="button" data-value="cycle">きりかえ</button>
            <button type="button" data-value="five">5ボタン</button>
          </div>
        </div>
        <button type="button" id="btn-reset" class="btn ghost setting-reset"><span aria-hidden="true">↻</span> <span class="label">はじめから</span></button>
        <button type="button" id="btn-settings-close" class="btn primary">とじる</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
